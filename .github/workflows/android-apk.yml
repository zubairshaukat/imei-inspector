name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle the web app into the APK
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r html/. android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/sw.js

      - name: Use signing key from secrets (optional)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/release.jks

      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || format('1.2.{0}', github.run_number) }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk imei-inspector.apk

      - uses: actions/upload-artifact@v4
        with:
          name: imei-inspector-apk
          path: imei-inspector.apk

      - name: Attach APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" imei-inspector.apk --clobber

      - name: Publish APK as a new release
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.2.${{ github.run_number }}
        run: |
          gh release create "$TAG" imei-inspector.apk \
            --target "${{ github.sha }}" \
            --title "IMEI Inspector $TAG" \
            --notes "Android app build from commit ${GITHUB_SHA::7}. Download imei-inspector.apk below and open it on your phone to install. It installs over any earlier version." \
            --latest
