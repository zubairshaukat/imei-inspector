services:
  imei-inspector:
    image: nginx:1.27-alpine
    container_name: imei-inspector
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - ai-net

networks:
  ai-net:
    external: true
    name: ai-agents_ai-net
